# 多平台打包发布：Windows / macOS / Linux
#
# 触发方式：
#   1. Actions 面板手动运行（可单选平台）—— 仅上传构建产物，不建 Release
#   2. 推送标签 v*（如 git tag v0.1.0 && git push origin v0.1.0）—— 构建全部平台并创建 Release
#
# 说明：每个平台/架构在对应的原生 runner 上构建，确保 better-sqlite3 等原生模块
# 针对目标 Electron ABI 正确重建。架构通过 --x64 / --arm64 开关传给 electron-builder。
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '要构建的平台（all = 全部）'
        type: choice
        required: true
        default: all
        options:
          - all
          - win
          - mac
          - linux
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 计算本次要构建哪些平台（手动触发时按输入过滤，标签触发时构建全部）
  meta:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: derive build matrix and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # 全部平台的构建定义。arch_flag 是 electron-builder CLI 开关。
          WIN='{"os":"windows-latest","platform":"win","arch":"x64","arch_flag":"--x64"}'
          MAC_X64='{"os":"macos-15-intel","platform":"mac","arch":"x64","arch_flag":"--x64"}'
          MAC_ARM='{"os":"macos-latest","platform":"mac","arch":"arm64","arch_flag":"--arm64"}'
          LINUX='{"os":"ubuntu-latest","platform":"linux","arch":"x64","arch_flag":"--x64"}'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_PLATFORM" in
              win)   ITEMS="$WIN" ;;
              mac)   ITEMS="$MAC_X64,$MAC_ARM" ;;
              linux) ITEMS="$LINUX" ;;
              *)     ITEMS="$WIN,$MAC_X64,$MAC_ARM,$LINUX" ;;
            esac
          else
            ITEMS="$WIN,$MAC_X64,$MAC_ARM,$LINUX"
          fi
          echo "matrix={\"include\":[$ITEMS]}" >> "$GITHUB_OUTPUT"
          echo "build matrix: {\"include\":[$ITEMS]}"

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # pnpm 11（见 package.json 的 packageManager）要求 Node >= 22.13：
      # 它内部 require('node:sqlite')（Node 22.5+ 内置），Node 20 下会报
      # ERR_UNKNOWN_BUILTIN_MODULE。先装 Node 22，再装 pnpm，
      # 保证 pnpm/action-setup 自检版本时也跑在 Node 22 上。
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      # pnpm 就绪后再 setup 一次以启用 store 缓存（setup-node 的 cache:pnpm 要求 pnpm 已可用）
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      # 注意：不要在此设置 NODE_ENV=production，否则 pnpm install 会跳过 devDependencies，
      # 导致 vite / esbuild / electron 缺失，构建直接失败。
      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: build source
        run: pnpm build

      # electron-builder 默认 npmRebuild=true，会自动用目标 Electron ABI 重建 native 模块，
      # 无需额外 electron-rebuild（该包也不在依赖里，pnpx 临时拉取不稳定）。
      - name: package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
        run: >-
          npx electron-builder --${{ matrix.platform }} ${{ matrix.arch_flag }}
          --config electron-builder.yml --publish never

      - name: collect artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="release-${PLATFORM}-${ARCH}"
          mkdir -p "$OUT"
          case "$PLATFORM" in
            win)
              # NSIS 安装版 + portable 便携版都在 release/ 根目录
              find release -maxdepth 1 -type f -name '*.exe' -exec cp {} "$OUT/" \;
              ;;
            mac)
              find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} "$OUT/" \;
              ;;
            linux)
              find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} "$OUT/" \;
              ;;
          esac
          echo "--- collected in $OUT ---"
          ls -lh "$OUT"
          # 防止空产物被上传后 release 步骤出错
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "::error::没有收集到任何 $PLATFORM 构建产物"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: panda-dingding-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: panda-dingding-*
          path: dist-artifacts/
          merge-multiple: true

      - name: build release body
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "PandaDingDing · 熊猫盯盯  ${VERSION}"
            echo ""
            echo "构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "提交：\`${GITHUB_SHA}\`"
            echo ""
            echo "## 下载"
            echo ""
            for f in dist-artifacts/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              size_mb=$(awk "BEGIN { printf \"%.2f\", $(stat -c%s "$f")/1048576 }")
              case "$name" in
                *-win-*-nsis.exe)       label="Windows 安装版 (NSIS)" ;;
                *-win-*-portable.exe)   label="Windows 便携版 (Portable)" ;;
                *-mac-arm64.dmg)        label="macOS Apple Silicon (DMG)" ;;
                *-mac-x64.dmg)          label="macOS Intel (DMG)" ;;
                *-mac-arm64.zip)        label="macOS Apple Silicon (ZIP)" ;;
                *-mac-x64.zip)          label="macOS Intel (ZIP)" ;;
                *-linux-*.AppImage)     label="Linux (AppImage)" ;;
                *-linux-*.deb)          label="Linux (deb)" ;;
                *)                      label="其他" ;;
              esac
              echo "- ${label} — [${name}](https://github.com/${REPO}/releases/download/${TAG}/${name})（${size_mb} MB）"
            done
            echo ""
            echo "> 行情数据仅供参考，不构成投资建议。"
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PandaDingDing ${{ needs.meta.outputs.version }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: dist-artifacts/*
