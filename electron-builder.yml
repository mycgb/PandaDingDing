# electron-builder 多平台打包配置
# 本地：pnpm dist（当前平台）；CI：.github/workflows/release.yml（Win/macOS/Linux）
#
# 注意：
# 1) pnpm monorepo + better-sqlite3 原生模块，依赖声明在根 package.json，
#    打包时由 electron-builder 针对目标平台的 Electron ABI 重建/下载 prebuild。
# 2) 代码路径：打包后 appPath = <install>/resources/app.asar，主进程产物在
#    app.asar/apps/main；resources 走 extraResources 落到 <install>/resources，
#    与 apps/main/src/index.ts 的 computePaths() 对应。
appId: com.pandadingding.app
productName: PandaDingDing
copyright: PandaDingDing

directories:
  output: release
  buildResources: resources

files:
  - package.json
  - apps/main/dist/**
  - apps/main/migrations/**
  - apps/renderer/dist/**
  - '!**/node_modules/**/{test,__tests__,tests,example,examples,docs}/**'
  - '!**/*.map'

# 皮肤/图标等静态资源放在 asar 外，主进程用 fs/net.fetch 直接读取
extraResources:
  - from: resources
    to: .

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

win:
  icon: resources/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-${target}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: PandaDingDing

mac:
  icon: resources/icons/icon.png
  category: public.app-category.finance
  # 无签名证书：关闭签名/公证，产物可直接运行（首次启动需在系统设置里放行）
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  icon: resources/icons/icon.png
  category: Office;Finance
  maintainer: mycgb <mycgb@foxmail.com>
  synopsis: 桌宠股票基金监控
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  provider: github
  owner: mycgb
  repo: PandaDingDing
